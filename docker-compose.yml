# Запуск одной командой:  docker compose up --build
services:
  redis:
    image: redis:7-alpine
    # Хранилище только для короткоживущих данных: без снапшотов на диск
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  otp:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      # Ключ HMAC: задайте свой в .env или окружении (OTP_SECRET=...)
      OTP_SECRET: ${OTP_SECRET:-change-me-in-production-please}
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-}
      OTP_DEMO_SHOW_CODE: ${OTP_DEMO_SHOW_CODE:-0}
      # IP, которым доверяем X-Forwarded-For (например, шлюз docker-сети для стенда жюри)
      OTP_TRUSTED_PROXIES: ${OTP_TRUSTED_PROXIES:-}
    ports:
      - "${OTP_BIND_ADDRESS:-0.0.0.0}:8000:8000"
    volumes:
      # тестовый SMS-транспорт: outbox/sms.jsonl появляется в корне репозитория на хосте
      - ./outbox:/srv/outbox
      - otp-logs:/srv/logs
    restart: unless-stopped

volumes:
  otp-logs:
